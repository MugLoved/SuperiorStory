plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.mugloved.superiorstory'
version = '1.1.0'
base { archivesName = 'superiorstory' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { superiorstory { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { superiorstory { source sourceSets.main } } }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')

jar {
    manifest { attributes('MixinConfigs': 'superiorstory.mixins.json') }
}
